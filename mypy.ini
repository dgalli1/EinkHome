# Mypy configuration for the EinkHome API server.
#
# The API is a loose module tree rooted at `api/` (the tests and the
# server both put `api/` on sys.path and import siblings as top-level
# packages: `from providers.mock import ...`, `from storage.ledger
# import ...`).  mypy must therefore resolve `api/` as the package base,
# otherwise every module is seen twice under two names.  We run it with
# the repo root as the working dir and MYPYPATH=<repo>/api.

[mypy]
python_version = 3.12
namespace_packages = True
explicit_package_bases = True
# No third-party stubs needed (stdlib only).  Recursive type checking on
# the whole tree is allowed to be imperfect; the goal is real None/type
# errors, not forcing every dict through a Protocol.
warn_unused_ignores = True