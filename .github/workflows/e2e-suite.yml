name: e2e-suite

# Reusable e2e runner: full environment setup + one test suite.
# Called by ci.yml once per suite.  Boot flakiness on hosted-runner
# kernels (monitor shmget crashes, boot hangs, informer deaths) is
# absorbed inside the suite: _start_emulator retries the boot cycle
# with backoff before failing.

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
        description: "bookshelf | scale"

env:
  FIRMWARE_URL: https://download.pocketbook-int.com/fw/Yitoa/634k3/user/20251201/sw_20251201_U634k3_6.10.2544_user.zip
  FIRMWARE_ZIP: sw_20251201_U634k3_6.10.2544_user.zip
  FIRMWARE_NAME: U634k3_6.10.2544

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Record pbemu submodule revision
        id: pbemu-rev
        run: echo "sha=$(git -C pbemu rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman catatonit slirp4netns fuse-overlayfs uidmap
      - name: Cache pbemu venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: pbemu/.venv
          key: pbemu-venv-${{ steps.pbemu-rev.outputs.sha }}-${{ hashFiles('pbemu/pyproject.toml') }}
      # A GH-cache restore can claim success yet deliver a tree whose
      # .venv/bin/python is absent (observed 2026-08-27 during a cache
      # service outage: BlobNotFound + silently incomplete archives).
      # Verify before trusting it; rebuild in place when broken so a
      # poisoned cache never bricks whole suites downstream.
      - name: Set up pbemu venv (verified)
        run: |
          cd pbemu
          if [ -x .venv/bin/python ] && \
             .venv/bin/python -c 'import sys, pytest, pbemu  # noqa: F401' 2>/dev/null; then
            echo 'cached venv usable'
          else
            echo 'venv missing/broken; rebuilding'
            rm -rf .venv
            ./setup-venv.sh
          fi
      - name: Cache PocketBook SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk/pocketbook-sdk-b288
          key: pb-sdk-b288-${{ hashFiles('sdk/install-sdk.sh') }}
      - name: Set up Rust (armv7 cross + zigbuild)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabi
      - name: Install cargo-zigbuild + zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Install zig
        # ubuntu-24.04 ships no zig package; cargo-zigbuild's documented
        # fallback runs zig via `python3 -m ziglang`.
        run: python3 -m pip install --quiet ziglang
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: eh_ui
      - name: Cache pbdev podman image
        id: cache-image
        uses: actions/cache@v4
        with:
          path: .cache/pbdev-image.tar
          key: pbdev-image-${{ steps.pbemu-rev.outputs.sha }}-${{ hashFiles('pbemu/Dockerfile') }}-${{ runner.arch }}
      - name: Load pbdev image from cache
        if: steps.cache-image.outputs.cache-hit == 'true'
        run: podman load -i .cache/pbdev-image.tar
      - name: Build pbdev image
        if: steps.cache-image.outputs.cache-hit != 'true'
        run: cd pbemu && .venv/bin/python -m pbemu image
      - name: Save pbdev image to cache
        if: steps.cache-image.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          podman save pbdev -o .cache/pbdev-image.tar
      - name: Restore firmware zip
        id: cache-fw
        uses: actions/cache/restore@v4
        with:
          path: .cache/fw
          key: pb-fw-${{ env.FIRMWARE_URL }}
      - name: Download firmware
        if: steps.cache-fw.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/fw
          curl -fL --retry 3 --retry-delay 5 -o ".cache/fw/${{ env.FIRMWARE_ZIP }}" "${{ env.FIRMWARE_URL }}"
          # Reject partial downloads now: a silently accepted truncated
          # zip would be cached under the immutable key above forever.
          unzip -tq ".cache/fw/${{ env.FIRMWARE_ZIP }}" >/dev/null
      - name: Save firmware zip for future runs
        # Persist immediately after a good download: actions/cache@v4's
        # implicit post-job save is skipped whenever ANY step of the job
        # fails afterwards (emulator flake, test failure), which kept
        # every e2e attempt re-downloading the ~1.1 GB zip.
        if: steps.cache-fw.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/fw
          key: pb-fw-${{ env.FIRMWARE_URL }}
      - name: Stage firmware
        run: |
          cd pbemu
          .venv/bin/python -m pbemu install "../.cache/fw/${{ env.FIRMWARE_ZIP }}"
      - name: Build emulator artifacts
        run: cd pbemu && .venv/bin/python -m pbemu build "${{ env.FIRMWARE_NAME }}"
      - name: Raise SysV shm limits for the emulator
        run: |
          # The guest's framebuffer shared-memory segment is ~6MB;
          # hosted-runner kernels vary in kernel.shmmax (some below
          # that), which makes the monitor's shmget fail intermittently
          # ("cannot get shared memory segment").  The container's IPC
          # namespace copies the limit at creation, so raise it first.
          sudo sysctl -w kernel.shmmax=67108864 kernel.shmall=16777216
      - name: Boot emulator once (create live tree)
        run: |
          cd pbemu
          # Same env the suite's own emulator start uses (env.py):
          # keep-id needs host subuid mappings that hosted runners may
          # lack, so the emulator runs with keep-id disabled, and the
          # tmpfs over /sys gives crun writable bind targets (cloud
          # kernels lack /sys/class/leds).
          if ! PBEMU_NO_KEEPID=1 PBEMU_PODMAN_ARGS="--tmpfs /sys:rw,nodev,nosuid,mode=755,size=2m" .venv/bin/python -m pbemu start "${{ env.FIRMWARE_NAME }}" --no-viewer --no-audio 2>&1; then
            echo "--- pbemu start failed; system.log tail ---"
            tail -100 "${{ env.FIRMWARE_NAME }}/.live/var/log/system.log" 2>/dev/null || true
            exit 1
          fi
          .venv/bin/python -m pbemu stop
      - name: Stage mock books
        run: ./scripts/stage-mock-books.sh "pbemu/${{ env.FIRMWARE_NAME }}"
      - name: Build bookshelf.app
        run: make PBEMU_FIRMWARE_DIR="$PWD/pbemu/${{ env.FIRMWARE_NAME }}"
      - name: Run suite
        env:
          # Mock provider serves the staged live books dir (server runs
          # with cwd=pbemu, so the path is firmware-relative).
          PB_TEST_FIRMWARE: ${{ env.FIRMWARE_NAME }}
          PBEMU_MOCK_BOOKS_DIR: ${{ env.FIRMWARE_NAME }}/.live/mnt/ext1/books
          # Hosted runners lack /sys/class entries the emulator binds.
          PBEMU_SYS_TMPFS: "1"
        run: |
          if [ "${{ inputs.suite }}" = "scale" ]; then
            # The 100k scale suite does not need the Open Library
            # corpus: the mock provider pads a missing corpus with its
            # deterministic synthetic layer, which the suite's
            # tile/paging/memory assertions are written against.
            pbemu/.venv/bin/python -m pytest tests/test_bookshelf_scale.py -q
          else
            pbemu/.venv/bin/python -m pytest tests/test_bookshelf.py -q
          fi
      - name: Capture host forensics on failure
        # Bookshelf-suite boots have died at guest-SHM init on hosted
        # runners while scale passes on neighbouring VMs of the same
        # image; kernel/podman state at death time is the missing
        # evidence (OOM kills, netavark crashes, sysctl drift).
        if: failure()
        run: |
          {
            echo '── sysctl IPC ──'
            sysctl kernel.shmmax kernel.shmall kernel.msgmax kernel.msgmnb \
              kernel.msgmni kernel.sem 2>&1
            echo '── limits ──'
            ulimit -a
            echo '── dmesg tail ──'
            sudo dmesg | tail -80
            echo '── podman events ──'
            podman events --since 30m --stream=false 2>&1 | tail -60
            echo '── containers ──'
            podman ps -a 2>&1
          } > build/host-forensics.txt 2>&1 || true
      - name: Generate HTML report
        # Playwright-style report (see docs/playwright-report-spec.md):
        # per-action screenshots + steps + errors, rendered from
        # build/report/results.json.  Best-effort: a generator failure
        # must not fail the job that already ran the tests.
        if: always()
        run: |
          pbemu/.venv/bin/python scripts/gen_report.py --firmware-dir "pbemu/${{ env.FIRMWARE_NAME }}" || true
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ inputs.suite }}-report
          path: build/report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload logs and screenshots
        # Upload on every run (success included) so any run can be
        # inspected: firmware-side logs, the API server log and the
        # per-action framebuffer screenshots.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ inputs.suite }}-logs
          path: |
            pbemu/${{ env.FIRMWARE_NAME }}/.live/var/log/*.log*
            pbemu/${{ env.FIRMWARE_NAME }}/.live/tmp/core*
            pbemu/${{ env.FIRMWARE_NAME }}/.live/tmp/bookshelf.log
            pbemu/${{ env.FIRMWARE_NAME }}/.live/mnt/ext1/system/bin/bookshelf.log
            pbemu/${{ env.FIRMWARE_NAME }}/.live/mnt/ext1/Downloads/
            build/
          if-no-files-found: ignore
          retention-days: 14
