name: dev-release

# Build every executable for every target and publish them as prereleases
# on GitHub:
#
#   bookshelf.app        PocketBook armel (every device but the InkPad One)
#   bookshelf.armhf.app  PocketBook armhf (InkPad One)
#   bookshelf.pc         desktop SDL app (x86_64 linux)
#   bookshelf.test       headless SDL app with the e2e IPC socket
#   einkhome-dev.apk     Android (arm64-v8a + x86_64 in one APK; built when
#                        the eh_android crate is on the branch — the demo
#                        line today, main once the port merges)
#   SHA256SUMS
#
# The device job mirrors the e2e-suite setup (podman pbdev toolchain,
# PocketBook SDK, staged firmware trees) but never boots the emulator:
# the apps only link against the staged rootfs.  The Android job is
# skipped when the branch has no eh_android crate.  Pull requests build
# everything but never publish; pushes to main/demo publish.

on:
  push:
    branches: [main, demo]
  pull_request:
    paths:
      - ".github/workflows/dev-release.yml"
      - "scripts/make-apk.sh"
      - "Makefile"
      - "sdk/**"
      - "app/**"
      - "eh_ui/crates/eh_android/**"
  workflow_dispatch:

concurrency:
  group: dev-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # armel: the firmware the emulator suite uses (Verse Pro Color); the
  # app links against its staged rootfs.
  FIRMWARE_URL: https://download.pocketbook-int.com/fw/Yitoa/634k3/user/20251201/sw_20251201_U634k3_6.10.2544_user.zip
  FIRMWARE_ZIP: sw_20251201_U634k3_6.10.2544_user.zip
  FIRMWARE_NAME: U634k3_6.10.2544
  # armhf: the InkPad One firmware (the only hard-float device).
  ARMHF_URL: https://download.pocketbook-int.com/fw/Jezetek/1030/user/20260713/swupdate_user_1030_6.11.1437.zip
  ARMHF_ZIP: swupdate_user_1030_6.11.1437.zip
  ARMHF_NAME: U1030_6.11.1437

jobs:
  device:
    name: Device apps (armel + armhf)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Record pbemu submodule revision
        id: pbemu-rev
        run: echo "sha=$(git -C pbemu rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman catatonit slirp4netns fuse-overlayfs uidmap
      - name: Cache pbemu venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: pbemu/.venv
          key: pbemu-venv-${{ steps.pbemu-rev.outputs.sha }}-${{ hashFiles('pbemu/pyproject.toml') }}
      - name: Set up pbemu venv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: cd pbemu && ./setup-venv.sh
      - name: Cache PocketBook SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk/pocketbook-sdk-b288
          key: pb-sdk-b288-${{ hashFiles('sdk/install-sdk.sh') }}
      - name: Install PocketBook SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: ./sdk/install-sdk.sh
      # The demo line's `make` first cross-builds libeh_pb.a with
      # cargo zigbuild; on the C line these steps are unused setup.
      - name: Set up Rust (armv7 cross + zigbuild)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabi,armv7-unknown-linux-gnueabihf
      # taiki-e/install-action bails on BASH_FUNC_ env leakage from the
      # apt steps; the static musl binary sidesteps that entirely.
      - name: Install cargo-zigbuild
        run: |
          curl -fsSL https://github.com/rust-cross/cargo-zigbuild/releases/latest/download/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz | tar xJ
          install -m755 cargo-zigbuild-x86_64-unknown-linux-musl/cargo-zigbuild "$HOME/.cargo/bin/cargo-zigbuild"
      - name: Install zig
        # ubuntu-24.04 ships no zig package; cargo-zigbuild's documented
        # fallback runs zig via `python3 -m ziglang`.
        run: python3 -m pip install ziglang
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: eh_ui
      - name: Cache pbdev podman image
        id: cache-image
        uses: actions/cache@v4
        with:
          path: .cache/pbdev-image.tar
          key: pbdev-image-${{ steps.pbemu-rev.outputs.sha }}-${{ hashFiles('pbemu/Dockerfile') }}-${{ runner.arch }}
      - name: Load pbdev image from cache
        if: steps.cache-image.outputs.cache-hit == 'true'
        run: podman load -i .cache/pbdev-image.tar
      - name: Build pbdev image
        if: steps.cache-image.outputs.cache-hit != 'true'
        run: cd pbemu && .venv/bin/python -m pbemu image
      - name: Save pbdev image to cache
        if: steps.cache-image.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          podman save pbdev -o .cache/pbdev-image.tar
      - name: Cache firmware zips
        id: cache-fw
        uses: actions/cache@v4
        with:
          path: .cache/fw
          key: pb-fw-devrel-${{ hashFiles('resources/supported-firmwares.tsv') }}
      - name: Download firmwares (armel + armhf)
        if: steps.cache-fw.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/fw
          curl -fL --retry 3 --retry-delay 5 -o ".cache/fw/${FIRMWARE_ZIP}" "${FIRMWARE_URL}"
          curl -fL --retry 3 --retry-delay 5 -o ".cache/fw/${ARMHF_ZIP}" "${ARMHF_URL}"
      - name: Stage firmwares
        run: |
          cd pbemu
          .venv/bin/python -m pbemu install "../.cache/fw/${FIRMWARE_ZIP}"
          # The armhf zip's name doesn't carry the U1030 firmware id, so
          # the staging dir must be pinned to what build_armhf.sh expects
          # (cwd is pbemu/, so the bare name lands at pbemu/U1030_...).
          .venv/bin/python -m pbemu install "../.cache/fw/${ARMHF_ZIP}" \
            --output-dir "${ARMHF_NAME}"
      - name: Build bookshelf.app (armel)
        run: make PBEMU_FIRMWARE_DIR="$PWD/pbemu/${FIRMWARE_NAME}"
      - name: Build bookshelf.armhf.app (armhf)
        # The armhf link uses ARMHF_FIRMWARE_DIR, which defaults to the
        # path `pbemu install` staged the InkPad One tree at.
        run: make armhf
      - name: Package device release zip
        # GitHub rejects `.app` as a release-asset extension, so the two
        # binaries ship inside the standard make-release.sh zip (which
        # also carries the ssh installer).
        run: scripts/make-release.sh --no-build
      - name: Cross-build the direct-fb device binary (demo line)
        # The KOReader-style binary: runtime-detects Kobo / reMarkable /
        # Cervantes / generic fb0.  Only the rust line has the crate; the
        # link needs an armv7 fontconfig, which the staged firmware tree
        # provides (same soname the devices ship).
        if: hashFiles('eh_ui/Cargo.toml') != ''
        run: |
          rustup target add armv7-unknown-linux-gnueabihf
          FW="$PWD/pbemu/${FIRMWARE_NAME}"
          ln -sf libfontconfig.so.1 "$FW/ebrmain/lib/libfontconfig.so"
          PKG_CONFIG_ALLOW_CROSS=1 \
            PKG_CONFIG_SYSROOT_DIR="$FW" \
            PKG_CONFIG_PATH="$PWD/resources/pkgconfig" \
            RUSTFLAGS="-L native=$FW/ebrmain/lib" \
            cargo zigbuild --release --target armv7-unknown-linux-gnueabihf.2.23 \
            --manifest-path eh_ui/Cargo.toml -p eh_device
          cp eh_ui/target/armv7-unknown-linux-gnueabihf/release/bookshelf-device \
            build/bookshelf-linux-armv7
      - name: Upload device artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dev-release-device
          path: |
            build/einkhome-*.zip
            build/bookshelf-linux-armv7
          if-no-files-found: error
          retention-days: 7

  host:
    name: Host apps (pc + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install dev libraries
        # Slint's text stack probes fontconfig; the SDL backend links
        # SDL2 (SDL2_ttf/SDL2_image for the C line's build_pc.sh).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libcurl4-openssl-dev
      # The rust line (demo) builds both hosts from the eh_ui workspace;
      # the C line (main) builds bookshelf.test via build_pc.sh with the
      # e2e IPC socket enabled.
      - name: Detect app lineage
        id: lineage
        run: |
          if [ -f eh_ui/Cargo.toml ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Rust
        if: steps.lineage.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: steps.lineage.outputs.rust == 'true'
        with:
          workspaces: eh_ui
      - name: Build host binaries (rust line)
        if: steps.lineage.outputs.rust == 'true'
        run: |
          make pc
          make test-host
      - name: Build host binaries (C line)
        if: steps.lineage.outputs.rust == 'false'
        run: |
          make pc
          BS_ENABLE_TEST_IPC=1 bash sdk/build_pc.sh --output build/bookshelf.test
      - name: Upload host binaries
        uses: actions/upload-artifact@v7
        with:
          name: dev-release-host
          path: |
            build/bookshelf.pc
            build/bookshelf.test
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK (arm64 + x86_64)
    # The port lives on the demo line today; build whenever the crate
    # is present so the APK joins the release automatically on merge.
    # (hashFiles is not available in job-level if, so the gate is a
    # step: everything after it is skipped on branches without the
    # crate and the job reports success.)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Gate on the eh_android crate
        id: gate
        run: |
          if [ -f eh_ui/crates/eh_android/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.gate.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK (cmdline-tools + licenses)
        if: steps.gate.outputs.present == 'true'
        uses: android-actions/setup-android@v3
      - name: Cache Android SDK components
        if: steps.gate.outputs.present == 'true'
        id: cache-android
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/platforms/android-34
          key: android-sdk-ndk-27.2.12479018-bt-37.0.0-p34
      - name: Install Android SDK components
        if: steps.gate.outputs.present == 'true' && steps.cache-android.outputs.cache-hit != 'true'
        run: |
          sdkmanager --install "ndk;27.2.12479018" "build-tools;37.0.0" "platforms;android-34" > /dev/null
      - name: Set up Rust (android cross targets)
        if: steps.gate.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.present == 'true'
        with:
          workspaces: eh_ui
      - name: Build APK
        if: steps.gate.outputs.present == 'true'
        run: scripts/make-apk.sh
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK: /usr/local/lib/android/sdk/ndk/27.2.12479018
      - name: Upload APK
        if: steps.gate.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dev-release-android
          path: build/einkhome-dev.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish dev release
    needs: [device, host, android]
    # PRs only rehearse the build; pushes (main/demo) and manual runs on
    # main publish.  The android job may be legitimately skipped.
    if: >-
      ${{
        always() && !cancelled() &&
        needs.device.result == 'success' &&
        needs.host.result == 'success' &&
        needs.android.result == 'success' &&
        (github.event_name == 'push' ||
         (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      # main and demo pushes can race for the same rolling release.
      group: dev-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: dev-release-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
      - name: Publish dev releases
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          SHORT="${SHA:0:7}"
          TAG="dev-${SHORT}"
          {
            echo "Dev build of \`${REF_NAME}\` @ ${SHA}"
            echo
            echo "Built by the [dev-release pipeline](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/dev-release.yml)."
            echo
            echo "| asset | target |"
            echo "| --- | --- |"
            echo "| \`einkhome-<sha>.zip\` | PocketBook: bookshelf.app (armel) + bookshelf.armhf.app (armhf) + install.sh |"
            echo "| \`bookshelf-linux-armv7\` | Kobo / reMarkable 1 / Cervantes / generic Linux fb (runtime-detecting) |"
            echo "| \`bookshelf.pc\` | desktop SDL (x86_64 linux) |"
            echo "| \`bookshelf.test\` | headless SDL + e2e IPC (x86_64 linux) |"
            echo "| \`einkhome-dev.apk\` | Android (arm64-v8a + x86_64) |"
            echo
            echo "PocketBook install: unzip, then \`./install.sh <device-ip> [api-url]\`."
            echo "Kobo/reMarkable: copy \`bookshelf-linux-armv7\` to the device and run it from its directory."
          } > notes.md
          # Immutable per-push prerelease: one release per built commit.
          # Re-running the workflow for the same SHA recreates its own
          # release rather than failing on the existing tag.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --prerelease \
            --title "Dev build (${REF_NAME} @ ${SHORT})" \
            --notes-file notes.md \
            --target "$SHA" \
            dist/*
          # Rolling alias: recreate so the `dev` tag always points at the
          # newest built commit, then upload the fresh assets.  Drop this
          # block if nothing consumes the rolling `dev` tag.
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          gh release create dev --prerelease \
            --title "Dev build (${REF_NAME} @ ${SHORT})" \
            --notes-file notes.md \
            --target "$SHA" \
            dist/*
          gh release view "$TAG" --json assets --jq '.assets[].name'
