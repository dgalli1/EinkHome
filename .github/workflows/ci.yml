name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The e2e suites boot the PocketBook firmware in an emulator container,
# so the firmware update zip is downloaded fresh on every run (we have
# no rights to redistribute it) and staged via the pbemu submodule's
# install.  Hosted-runner kernels are intermittently unstable for the
# qemu guest, so each suite has a retry job that re-runs it on a fresh
# runner when the primary run fails.
jobs:
  api-tests:
    name: API unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Record pbemu submodule revision
        id: pbemu-rev
        run: echo "sha=$(git -C pbemu rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache pbemu venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: pbemu/.venv
          key: pbemu-venv-${{ steps.pbemu-rev.outputs.sha }}-${{ hashFiles('pbemu/pyproject.toml') }}
      - name: Set up pbemu venv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: cd pbemu && ./setup-venv.sh
      - name: Run api unit tests
        run: pbemu/.venv/bin/python -m pytest api/tests -q

  rust-tests:
    name: Rust unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: eh_ui
      # The eh_ui workspace needs no submodule, firmware or emulator —
      # the unit suite runs in seconds; one build script wants
      # pkg-config + fontconfig headers and the SDL backend links
      # -lSDL2 for its tests (installed below).
      - name: Install Rust build deps (pkg-config, fontconfig, SDL2)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev
      - name: Run make test-rust
        run: make test-rust

  e2e:
    name: E2E (bookshelf suite)
    uses: ./.github/workflows/e2e-suite.yml
    with:
      suite: bookshelf

  e2e-scale:
    name: E2E (100k scale suite)
    uses: ./.github/workflows/e2e-suite.yml
    with:
      suite: scale

