name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Static-analysis gate: clippy on the Rust workspace; ruff + mypy +
# coverage on the Python.  Everything here runs on a plain hosted
# runner — no firmware, no emulator boot.
jobs:
  rust:
    name: Rust (clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabi armv7-unknown-linux-gnueabihf
      # Slint's text stack builds yeslogic-fontconfig-sys, whose build
      # script shells out to pkg-config for fontconfig.
      - name: Install pkg-config + fontconfig headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Install zig
        # ubuntu-24.04 ships no zig package; cargo-zigbuild's documented
        # fallback runs zig via `python3 -m ziglang`.
        run: python3 -m pip install --quiet ziglang
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: eh_ui
      - name: Run make fmt
        run: make fmt
      - name: Run make clippy
        run: make clippy
      - name: Run cargo doc (zero warnings)
        run: cd eh_ui && RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  python:
    name: Python (ruff, mypy, coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python3 -m pip install ruff mypy pytest pytest-cov pillow
      - name: Run make lint-py
        # mypy + coverage need api/providers/storage importable as
        # top-level packages (see mypy.ini); MYPYPATH is set by the target.
        run: make lint-py