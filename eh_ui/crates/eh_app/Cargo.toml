[package]
name = "eh_app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
eh_hal = { path = "../eh_hal" }
eh_render = { path = "../eh_render" }

# UI toolkit: the whole presentation layer (screens, widgets, hit-testing)
# is Slint markup rendered by the software renderer straight into the
# backend framebuffer.  No windowing backend: the app owns the event loop
# and drives MinimalSoftwareWindow directly (see src/ui/mod.rs).
slint = { version = "1.17", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-software",
] }

# HTTP to the LAN pbemu-api server.  No TLS: the device talks to the API
# server over plain http (api_url from bookshelf.cfg); TLS termination (if a
# remote Kavita needs it) happens in the Python server.  Disabling ureq's tls
# features keeps the dep pure-std (no ring/rustls C build) so it cross-compiles
# to armv7 .2.23 without extra toolchain.
ureq = { version = "2", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"


# SQLite persistence with the exact existing books/meta/view/search schema
# (device DB stays compatible with the C app's store).  bundled cross-compiles
# the C glue via zig cc under cargo-zigbuild.
rusqlite = { version = "0.33", features = ["bundled"] }

# Cover decoding: covers are served as PNG (cached covers dir) or JPEG
# (the raw /cover endpoint — 240x360 JPEGs for Kavita).  Single-threaded
# decoder (no rayon) keeps the embedded footprint small.
png = "0.17"

# Local-library metadata extraction (C rust_extract replacement): epub is a
# zip container whose OPF carries title/author; fb2 is plain XML.  Both
# parsers are pure Rust.  zip runs with default features trimmed (deflate
# only) so the armv7 cross-build stays free of C compression backends.
quick-xml = "0.37"
zip = { version = "2", default-features = false, features = ["deflate"] }
jpeg-decoder = { version = "0.3", default-features = false }
# PDF first-page rendering (cover art) via the vendored MuPDF C build.
# Optional: the Android port compiles without it (PDF metadata extraction
# stays pure-Rust; only the page-render fallback is unavailable).
mupdf = { version = "0.8.0", optional = true, default-features = false, features = ["base14-fonts"] }

[dev-dependencies]
tempfile = "3"
eh_backend_sdl = { path = "../eh_backend_sdl" }
parking_lot = "0.12"

[build-dependencies]
slint-build = "1.17"


[features]
default = ["pdf-mupdf"]
pdf-mupdf = ["dep:mupdf"]
